name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # ============================================================
  # Job 1 -- Code Quality Checks (Python & Prettier)
  # ============================================================
  code_quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python formatters
        run: |
          python -m pip install --upgrade pip
          python -m pip install autoflake black==25.11.0

      - name: Check Python Code Quality
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Running autoflake check ==="
          autoflake --remove-all-unused-imports --remove-unused-variables --recursive --check .
          echo "=== Running black check ==="
          black . --check

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Global Formatters
        run: npm install -g prettier prettier-plugin-solidity

      - name: Run Global Prettier Check
        shell: bash
        run: |
          set -euo pipefail
          NODE_GLOBAL=$(npm root -g)
          echo "=== Running Prettier check ==="
          prettier --plugin="$NODE_GLOBAL/prettier-plugin-solidity/dist/index.js" \
            --check "**/*.{js,jsx,ts,tsx,json,html,css,md,sol,yml,yaml}"

  # ====================================================================
  # Job 2 -- Backend Test & Build (Pytest + Docker image + smoke test)
  # ====================================================================
  backend_test_build:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality

    env:
      BACKEND_DIR: code/backend
      IMAGE_NAME: nexora-backend
      CONTAINER_NAME: nexora-backend-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: code/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f "${BACKEND_DIR}/requirements.txt" ]; then
            python -m pip install -r "${BACKEND_DIR}/requirements.txt"
          fi
          python -m pip install pytest pytest-cov pytest-asyncio

      - name: Run backend test suite
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          set -euo pipefail
          pytest tests/ \
            --tb=short \
            --strict-markers \
            -v \
            --cov=. \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: code/backend/coverage.xml
          retention-days: 30

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: code
          file: code/Dockerfile
          target: runtime
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image runs as a non-root user
        run: |
          set -euo pipefail
          uid=$(docker run --rm --entrypoint id "${IMAGE_NAME}:ci" -u)
          echo "Container user id: ${uid}"
          if [ "${uid}" = "0" ]; then
            echo "Image must not run as root." >&2
            exit 1
          fi

      - name: Smoke test the built image
        run: |
          set -euo pipefail

          docker run -d \
            --name "${CONTAINER_NAME}" \
            -p 8000:8000 \
            "${IMAGE_NAME}:ci"

          echo "=== Waiting for backend to respond ==="
          ready=false
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health -o response.txt; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            echo "Backend did not become ready in time." >&2
            docker logs "${CONTAINER_NAME}"
            exit 1
          fi

          echo "=== Response ==="
          head -c 600 response.txt
          echo
          grep -q '"status":"healthy"' <(tr -d ' \n' < response.txt) || {
            echo "Health endpoint did not report healthy." >&2
            docker logs "${CONTAINER_NAME}"
            exit 1
          }

      - name: Show container logs on failure
        if: failure()
        run: docker logs "${CONTAINER_NAME}" || true

      - name: Stop container
        if: always()
        run: docker rm -f "${CONTAINER_NAME}" || true

  # ============================================================
  # Job 3 -- ML Core Test & Validation (Pytest + coverage)
  # ============================================================
  ml_core_test:
    name: ML Core Test & Validation
    runs-on: ubuntu-latest
    needs: code_quality
    timeout-minutes: 45

    env:
      ML_CORE_DIR: code/ml_core
      # ml_core is imported as a top-level package, so code/ must be on the path.
      PYTHONPATH: ${{ github.workspace }}/code

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: code/requirements.txt

      # ml_core has no requirements file of its own; code/requirements.txt is the
      # consolidated set (numpy, pandas, scikit-learn, scipy, lifelines, faker,
      # FastAPI, pytest, ...). TensorFlow, PyTorch and Apache Beam are optional:
      # the modules that use them guard their imports.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r code/requirements.txt

      - name: Byte-compile all ml_core sources
        run: |
          set -euo pipefail
          echo "=== Compiling compliance, explainability, models, monitoring, pipeline, utils, validation and tests ==="
          python -m compileall -q "${ML_CORE_DIR}"

      - name: Verify sub-packages import cleanly
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib

          import ml_core

          for module in (
              "compliance.phi_audit_logger",
              "explainability.explainer",
              "feature_store.feature_store",
              "models.base_model",
              "models.deep_fm",
              "models.fairness_metrics",
              "models.model_calibration",
              "models.model_registry",
              "models.survival_analysis",
              "models.transformer_model",
              "monitoring.adverse_event_reporting",
              "monitoring.clinical_metrics",
              "monitoring.concept_drift",
              "pipeline.clinical_etl",
              "pipeline.data.synthetic_clinical_data",
              "pipeline.data_validation",
              "pipeline.hipaa_compliance.deidentifier",
              "pipeline.hipaa_compliance.integration",
              "pipeline.hipaa_compliance.phi_detector",
              "pipeline.icd10_encoder",
              "pipeline.temporal_features",
              "utils.fhir_connector",
              "utils.fhir_ops",
              "utils.healthcare_metrics",
              "validation.pipeline_validator",
              "versioning.artifact_store",
          ):
              importlib.import_module(f"ml_core.{module}")
              print(f"OK   ml_core.{module}")
          print(f"ml_core {ml_core.__version__} imports cleanly")
          PY

      - name: Run ml_core test suite
        working-directory: ${{ env.ML_CORE_DIR }}
        run: |
          set -euo pipefail
          pytest tests/ \
            --cov=ml_core \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml

      - name: Upload ml_core coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-core-coverage-report
          path: code/ml_core/coverage.xml
          if-no-files-found: ignore
          retention-days: 30

  # ============================================================
  # Job 4 -- Web Frontend Test & Build
  # ============================================================
  web-frontend_test_and_build:
    name: Web-Frontend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: web-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run frontend tests
        run: CI=true npm test

      - name: Build web-frontend
        run: CI=false npm run build

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web-frontend/dist/
          retention-days: 7

  # ============================================================
  # Job 5 -- Mobile Frontend (Expo) Test & Build
  # ============================================================
  mobile_frontend:
    name: Mobile-Frontend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: mobile-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Mobile Tests
        run: npm run test:ci

      - name: Build Mobile Web Export
        run: CI=false npm run build:web

      - name: Upload Mobile Web Build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-web-dist
          path: mobile-frontend/dist/
          retention-days: 7
